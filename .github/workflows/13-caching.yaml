name: 13 - Using Caching
on:
    workflow_dispatch: 
        inputs:
            use-cache:
                description: Use Cache Step
                type: boolean
                default: true
jobs:
    build:
        runs-on: ubuntu-latest        
        defaults:
            run:
              working-directory: 13-caching/react-app
        steps:
            # 1. Checkout the code and setup node
            - name: Checkout code
              uses: action/checkout@v4
            
            - name: Setup Node
              uses: action/setup-node@v3
              with:
                  node-version: '20.x'
            
            # 2. Install dependencies
            - name: Install Dependencies            
              run: npm ci

            # 3. Unit testing, building
            - name: Testing
              run: npm run test

            - name: Building
              run: npm run build

            - name: Deploying to Non-Prod environment
              run: echo "Deploying to Non-Prod..."
