name: 13 - Using Caching
on:
    workflow_dispatch: 
        inputs:
            use-cache:
                description: Use Cache Step
                type: boolean
                default: true
            node-version:
                description: Node Version
                type: choice
                options:
                  - 20.x                  
                  - 21.x
                  - 22.x
                  - 23.x
                  - 24.x
                default: 24.x
jobs:
    build:
        runs-on: ubuntu-latest        
        defaults:
            run:
              working-directory: 13-caching/react-app
        steps:
            # 1. Checkout the code and setup node
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                  node-version: ${{ inputs.node-version }}
            
            # 2. Install dependencies
            - name: Install Dependencies            
              run: npm ci

            # 3. Unit testing, building
            - name: Testing
              run: npm run test

            - name: Building
              run: npm run build

            - name: Deploying to Non-Prod environment
              run: echo "Deploying to Non-Prod..."
