name: 13 - Using Caching
on:
    workflow_dispatch: 
        inputs:
            use-cache:
                description: Use Cache Step
                type: boolean
                default: true
            node-version:
                description: Node Version
                type: choice
                options:
                  - 20.x                  
                  - 21.x
                  - 22.x
                  - 23.x
                  - 24.x
                default: 24.x
jobs:
    install-deps:
        runs-on: ubuntu-latest
        defaults:
            run:
              working-directory: 13-caching/react-app
        outputs:
            deps-cache-key: ${{ steps.cache-key.outputs.CACHE_KEY }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Calculate Chache Key
              id: cache-key
              run: |
                echo "CACHE_KEY=deps-node-modules-${{ hashFiles('13-caching/react-app/package-lock.json') }}" >> "$GITHUB_OUTPUT"

            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                  node-version: ${{ inputs.node-version }}
            
            - name: Download Cached Dependencies
              uses: actions/cache@v3
              if: ${{inputs.use-cache}}
              id: cache
              with:
                # specifies the path dependencies we want to cache
                path: 13-caching/react-app/node_modules
                # specifies the file that controls hash for changes on dependencies files, 
                # i.e, if something changed within this file, cache has to be reloaded
                key: ${{ steps.cache-key.outputs.CACHE_KEY }}

            - name: Install Dependencies
              if : ${{ steps.cache.outputs.cache-hit != 'true' }}          
              run: npm ci

    lint-test:
        runs-on: ubuntu-latest 
        needs: install-deps       
        defaults:
            run:
              working-directory: 13-caching/react-app
        steps:
            # 1. Checkout the code and setup node
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                  node-version: ${{ inputs.node-version }}
            
            # 2. Install dependencies
            - name: Download Cached Dependencies
              uses: actions/cache@v3
              if: ${{inputs.use-cache}}
              id: cache
              with:
                path: 13-caching/react-app/node_modules
                key: ${{ needs.install-deps.outputs.deps-cache-key }}

            - name: Install Dependencies
              if : ${{ steps.cache.outputs.cache-hit != 'true' }}          
              run: npm ci
                            
            # 3. Unit testing, building
            - name: Testing
              run: npm run test

            - name: Linting
              run: echo "Linting..."

    build:
        runs-on: ubuntu-latest 
        needs: install-deps       
        defaults:
            run:
              working-directory: 13-caching/react-app
        steps:
            # 1. Checkout the code and setup node
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                  node-version: ${{ inputs.node-version }}
            
            # 2. Install dependencies
            - name: Download Cached Dependencies
              uses: actions/cache@v3
              if: ${{inputs.use-cache}}
              id: cache
              with:
                # specifies the path dependencies we want to cache
                path: 13-caching/react-app/node_modules
                # specifies the file that controls hash for changes on dependencies files, 
                # i.e, if something changed within this file, cache has to be reloaded
                # key: deps-node-modules-${{ hashFiles('13-caching/react-app/package-lock.json') }}
                key: ${{ needs.install-deps.outputs.deps-cache-key }}

            - name: Install Dependencies
              if : ${{ steps.cache.outputs.cache-hit != 'true' }}          
              run: npm ci

            # 3. Unit testing, building
            - name: Building
              run: npm run build

            - name: Deploying to Non-Prod environment
              run: echo "Deploying to Non-Prod..."
