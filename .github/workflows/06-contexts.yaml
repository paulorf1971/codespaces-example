name: 06 - Contexts
run-name: Workflow execution with Context | DEBUG ${{ inputs.debug }}
on:
    workflow_dispatch: 
        inputs:
          debug:
            description: Debug
            type: boolean
            default: false

env:
  MY_WORKFLOW_VAR: 'Workflow variable'
  MY_WORKFLOW_OVERWRITTEN_VAR: 'Overwritten variable'

jobs:
    echo-data:
        runs-on: ubuntu-latest
        env:
          MY_JOB_VAR: 'job variable'
          MY_WORKFLOW_OVERWRITTEN_VAR: 'job overwritten variable'
        steps:
            - name: Display information
              run: |
                echo "Event Name: ${{github.event_name}}"
                echo "Ref: ${{github.ref}}"
                echo "SHA: ${{github.sha}}"
                echo "Actor: ${{github.actor}}"
                echo "Workflow: ${{github.worflow}}"
                echo "Run ID: ${{github.run_id}}"
                echo "Run Number: ${{github.run_number}}"

            - name: Retrieve variable
              run: |
                echo "Variable value: ${{ vars.MY_VAR }}"
            
            - name: Print Environment Variables
              env:
                MY_WORKFLOW_OVERWRITTEN_VAR: 'new job overwritten variable'
              run: |
                echo "Workflow env var: ${{env.MY_WORKFLOW_VAR}}"
                echo "Overwritten env var: ${{env.MY_WORKFLOW_OVERWRITTEN_VAR}}"
            
            - name: Print Environment Variables with no local env
              run: |
                echo "Workflow env var: ${{env.MY_WORKFLOW_VAR}}"
                echo "Overwritten env var: ${{env.MY_WORKFLOW_OVERWRITTEN_VAR}}"
                echo "Job env var: ${{env.MY_WORKFLOW_OVERWRITTEN_VAR}}"


